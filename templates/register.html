{% extends "base.html" %}
{% block title %}Register - Vitamin D Tracker{% endblock %}
{% block content %}
<div class="card">
  <h2 style="margin-top:0">Create account</h2>
  <form method="post">
    <label>Name</label><input name="name" required>
    <label>Email</label><input name="email" type="email" required>
    <label>Password (min 8 characters)</label><input name="password" type="password" minlength="8" required>
    <button type="submit">Register</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
